<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>Your TheTanti Order Has Shipped</title>

<style>
  body { margin:0 !important; padding:0 !important; background:#f8f2f4; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table { border-collapse:collapse; border-spacing:0; }
  img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; max-width:100%; }
  a { text-decoration:none; }
  .container { width:100%; max-width:620px; margin:0 auto; }
  .card { background:#ffffff; border:1px solid #eadfe4; border-radius:18px; overflow:hidden; }
  .content { padding:38px 42px; }
  .eyebrow { font:700 11px Arial,Helvetica,sans-serif; letter-spacing:2px; text-transform:uppercase; color:#b62967; }
  .title { margin:10px 0 12px; font:700 30px/1.2 Georgia,'Times New Roman',serif; color:#4b0b2b; }
  .text { margin:0; font:400 15px/1.7 Arial,Helvetica,sans-serif; color:#5e5560; }
  .button { display:inline-block; background:#b62967; color:#ffffff !important; padding:14px 24px; border-radius:999px; font:700 14px Arial,Helvetica,sans-serif; }
  .soft { background:#fff6f9; border:1px solid #f0dce5; border-radius:14px; }
  .label { font:700 11px Arial,Helvetica,sans-serif; color:#8a7c84; text-transform:uppercase; letter-spacing:1px; }
  .value { font:700 15px Arial,Helvetica,sans-serif; color:#4b0b2b; }
  .footer { padding:28px 20px; text-align:center; }
  .footer-text { font:400 12px/1.6 Arial,Helvetica,sans-serif; color:#8c8088; }
  .mobile-pad { padding-left:42px; padding-right:42px; }
  @media screen and (max-width: 640px) {
    .container { width:100% !important; }
    .content { padding:28px 20px !important; }
    .mobile-pad { padding-left:20px !important; padding-right:20px !important; }
    .title { font-size:26px !important; }
    .stack { display:block !important; width:100% !important; }
    .button { display:block !important; text-align:center !important; }
  }
</style>

</head>
<body>
<center style="width:100%;background:#f8f2f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td align="center" style="padding:28px 12px;">
<table role="presentation" class="container" cellpadding="0" cellspacing="0" border="0">
<tr><td align="center" style="padding:8px 0 24px;">
  <a href="https://www.thetanti.shop/" target="_blank">
    <img src="{{logo_url}}" width="250" alt="TheTanti — Sarees for Every Story" style="display:block;width:250px;max-width:80%;height:auto;">
  </a>
</td></tr>

<tr><td class="card">
  <div class="content">
    <div class="eyebrow">Your Saree Is On The Way</div>
    <h1 class="title">Your order has shipped! 🚚</h1>
    <p class="text">Hi {{customer_name}}, your TheTanti order <strong>#{{order_number}}</strong> is now on its way to you.</p>

    <div class="soft" style="margin-top:24px;padding:20px;">
      <table role="presentation" width="100%">
        <tr><td><span class="label">Courier</span><br><span class="value">{{courier_name}}</span></td>
        <td align="right"><span class="label">Tracking</span><br><span class="value">{{tracking_number}}</span></td></tr>
      </table>
    </div>

    <div style="height:26px;line-height:26px;">&nbsp;</div>
    <a class="button" href="{{tracking_url}}" target="_blank">Track Shipment</a>
  </div>
</td></tr>

<tr><td class="footer">
  <p class="footer-text" style="margin:0 0 8px;">Sarees for every story.</p>
  <p class="footer-text" style="margin:0;">
    <a href="https://www.thetanti.shop/" style="color:#b62967;">www.thetanti.shop</a>
    &nbsp;•&nbsp; © 2026 TheTanti. All rights reserved.
  </p>
</td></tr>
</table>
</td></tr>
</table>
</center>
</body>
</html>
